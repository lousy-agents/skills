---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Run skill script tests
        run: python3 -m unittest discover -s tests -v

  lousy-agents:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      checks: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Validate catalog JSON
        run: |
          fail=0
          for f in skills/*/.claude-plugin/plugin.json .claude-plugin/marketplace.json skills.sh.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::invalid JSON"; fail=1; }
          done
          exit $fail

      # Skill discovery looks under .github/skills/, .claude/skills/, and
      # .agents/skills/ and lists only real directories. This repo keeps
      # canonical skills in skills/ with .github/skills -> ../skills as a
      # symlink, which discovery does not follow — so without materializing
      # a real tree, lint reports "No skill(s) found" and code-tidy is never
      # gated. Dual path: edit skills/<name>/; CI copies into .github/skills
      # for the lint job only (checkout is disposable).
      - name: Materialize skills for lint discovery
        run: |
          rm -f .github/skills
          cp -a skills .github/skills

      - name: Lint with lousy-agents
        uses: zpratt/lousy-agents@99bd67b5eec8ec829b6e0fb3b5c9d7a5bdb8b37f  # v5.14.2
        with:
          github_token: ${{ github.token }}
          skills: "true"
