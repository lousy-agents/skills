# Project-local Codex MCP configuration.
# Mirrors .mcp.json for Codex CLI and IDE clients in this trusted repository.

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@2.2.1"]

[mcp_servers."lousy-agents"]
command = "npx"
args = ["-y", "-p", "@lousy-agents/mcp", "lousy-agents-mcp"]

[mcp_servers."sequential-thinking"]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]
